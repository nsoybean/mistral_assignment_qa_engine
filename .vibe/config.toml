[[mcp_servers]]
name = "mistral-documentation"
transport = "stdio"
command = "uv"
args = [
    "run",
    "python",
    "-m",
    "entrypoints.mcp_server",
]

[tools.mistral-documentation_search]
permission = "always"

[tools.mistral-documentation_open]
permission = "always"

[tools.mistral-documentation_grep]
permission = "always"

[tools.mistral-documentation_read]
permission = "always"
